services:
  db:
    image: postgres:16
    container_name: schedulnyx-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: schedulnyx
      POSTGRES_PASSWORD: schedulnyx_dev
      POSTGRES_DB: schedulnyx
    ports:
      - "5432:5432"
    volumes:
      - schedulnyx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedulnyx"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  schedulnyx_pgdata:
